name: Inception CI

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  inception:
    name: Build and test Inception
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: srcs

    steps:

      # ==========================================
      # 1. Checkout repository
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Docker information
      # ==========================================
      - name: Check Docker
        run: |
          docker --version
          docker compose version


      # ==========================================
      # 3. Create CI environment
      # ==========================================
      - name: Create CI environment
        run: |
          mkdir -p /tmp/inception-data/mariadb
          mkdir -p /tmp/inception-data/wordpress

          cat > .env <<'EOF'
          DATA_PATH=/tmp/inception-data
          MYSQL_DATABASE=wordpress
          MYSQL_USER=wpuser
          MYSQL_PASSWORD=testpassword
          MYSQL_ROOT_PASSWORD=testrootpassword
          DOMAIN_NAME=localhost
          EOF

          echo "CI environment created"


      # ==========================================
      # 4. Check environment
      # ==========================================
      - name: Check environment
        run: |
          echo "DATA_PATH:"
          grep '^DATA_PATH=' .env

          echo "Checking directories..."

          test -d /tmp/inception-data/mariadb
          test -d /tmp/inception-data/wordpress

          echo "Environment OK"


      # ==========================================
      # 5. Validate Compose
      # ==========================================
      - name: Validate Docker Compose
        run: |
          docker compose config


      # ==========================================
      # 6. Build images
      # ==========================================
      - name: Build Docker images
        run: |
          docker compose build --no-cache


      # ==========================================
      # 7. Start containers
      # ==========================================
      - name: Start Inception
        run: |
          docker compose up -d


      # ==========================================
      # 8. Show containers
      # ==========================================
      - name: Show containers
        run: |
          docker compose ps


      # ==========================================
      # 9. Wait for MariaDB
      # ==========================================
      - name: Wait for MariaDB
        run: |
          echo "Waiting for MariaDB..."

          for i in {1..60}; do

            if docker compose exec -T mariadb \
              mariadb-admin ping \
              -h localhost \
              -u root \
              -ptestrootpassword \
              --silent; then

              echo "MariaDB is ready!"
              exit 0
            fi

            echo "MariaDB not ready..."
            sleep 2
          done

          echo "MariaDB failed to start"

          docker compose logs mariadb

          exit 1


      # ==========================================
      # 10. Test MariaDB
      # ==========================================
      - name: Test MariaDB
        run: |
          docker compose exec -T mariadb \
            mariadb \
            -u root \
            -ptestrootpassword \
            -e "SHOW DATABASES;"

          echo "MariaDB test passed"


      # ==========================================
      # 11. Wait for WordPress
      # ==========================================
      - name: Wait for WordPress
        run: |
          echo "Waiting for WordPress..."

          for i in {1..60}; do

            if docker compose exec -T wordpress \
              test -d /var/www/html/wp-admin; then

              echo "WordPress files detected!"
              exit 0
            fi

            echo "WordPress not ready..."
            sleep 2
          done

          echo "WordPress failed to initialize"

          docker compose logs wordpress

          exit 1


      # ==========================================
      # 12. Test WordPress files
      # ==========================================
      - name: Test WordPress
        run: |
          echo "Checking WordPress..."

          docker compose exec -T wordpress \
            test -d /var/www/html/wp-admin

          docker compose exec -T wordpress \
            test -d /var/www/html/wp-content

          docker compose exec -T wordpress \
            test -f /var/www/html/index.php

          echo "WordPress files are OK"


      # ==========================================
      # 13. Test WordPress -> MariaDB
      # ==========================================
      - name: Test WordPress network
        run: |
          echo "Testing WordPress -> MariaDB..."

          docker compose exec -T wordpress \
            getent hosts mariadb

          echo "WordPress can resolve MariaDB"


      # ==========================================
      # 14. Test NGINX configuration
      # ==========================================
      - name: Test NGINX configuration
        run: |
          docker compose exec -T nginx nginx -t

          echo "NGINX configuration is valid"


      # ==========================================
      # 15. Wait for HTTPS
      # ==========================================
      - name: Wait for HTTPS
        run: |
          echo "Waiting for NGINX HTTPS..."

          for i in {1..60}; do

            if curl \
              --fail \
              --insecure \
              --silent \
              --show-error \
              https://localhost/ \
              > /dev/null; then

              echo "HTTPS is working!"
              exit 0
            fi

            echo "HTTPS not ready..."
            sleep 2
          done

          echo "HTTPS failed"

          docker compose logs nginx

          exit 1


      # ==========================================
      # 16. Test HTTPS response
      # ==========================================
      - name: Test HTTPS
        run: |
          echo "Testing HTTPS response..."

          HTTP_CODE=$(curl \
            --insecure \
            --silent \
            --output /dev/null \
            --write-out "%{http_code}" \
            https://localhost/)

          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 400 ]; then
            echo "HTTPS returned an invalid status"
            exit 1
          fi

          echo "HTTPS test passed"


      # ==========================================
      # 17. Check containers
      # ==========================================
      - name: Check containers
        run: |
          docker compose ps

          if docker compose ps | grep -Ei "Exit|Dead"; then
            echo "A container has stopped!"
            exit 1
          fi

          echo "All containers are running"


      # ==========================================
      # 18. Check volumes
      # ==========================================
      - name: Check volumes
        run: |
          docker volume ls

          docker volume inspect srcs_mariadb_data
          docker volume inspect srcs_wordpress_data

          echo "Volumes are OK"


      # ==========================================
      # 19. Show logs if something fails
      # ==========================================
      - name: Show logs on failure
        if: failure()
        run: |
          echo "======================================"
          echo "CONTAINER STATUS"
          echo "======================================"

          docker compose ps

          echo
          echo "======================================"
          echo "CONTAINER LOGS"
          echo "======================================"

          docker compose logs --no-color


      # ==========================================
      # 20. Cleanup
      # ==========================================
      - name: Cleanup
        if: always()
        run: |
          docker compose down -v --remove-orphans || true
          docker system prune -af || true