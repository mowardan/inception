name: Inception CI

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  inception:
    name: Build and test Inception
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: srcs

    steps:
      # ==========================================
      # 1. Checkout repository
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. Check Docker
      # ==========================================
      - name: Check Docker
        run: |
          docker --version
          docker compose version

      # ==========================================
      # 3. Create CI environment
      # ==========================================
      - name: Create CI environment
        run: |
          mkdir -p /tmp/inception-data/mariadb
          mkdir -p /tmp/inception-data/wordpress

          cat > .env <<'EOF'
          DATA_PATH=/tmp/inception-data
          MYSQL_DATABASE=wordpress
          MYSQL_USER=wpuser
          MYSQL_PASSWORD=testpassword
          MYSQL_ROOT_PASSWORD=testrootpassword
          DOMAIN_NAME=localhost
          EOF

          echo "CI environment created"

      # ==========================================
      # 4. Verify environment
      # ==========================================
      - name: Verify environment
        run: |
          echo "DATA_PATH:"
          grep '^DATA_PATH=' .env

          echo "Checking directories:"
          test -d /tmp/inception-data/mariadb
          test -d /tmp/inception-data/wordpress

          echo "Directories OK"

      # ==========================================
      # 5. Validate Docker Compose
      # ==========================================
      - name: Validate Docker Compose
        run: |
          docker compose config

      # ==========================================
      # 6. Build Docker images
      # ==========================================
      - name: Build Docker images
        run: |
          docker compose build --no-cache

      # ==========================================
      # 7. Start Inception
      # ==========================================
      - name: Start Inception
        run: |
          docker compose up -d

      # ==========================================
      # 8. Show containers
      # ==========================================
      - name: Show containers
        run: |
          docker compose ps

      # ==========================================
      # 9. Wait for MariaDB
      # ==========================================
      - name: Wait for MariaDB
        run: |
          echo "Waiting for MariaDB..."

          for i in {1..60}; do
            if docker compose exec -T mariadb \
              mariadb-admin ping \
              -h localhost \
              -u root \
              -ptestrootpassword \
              --silent; then

              echo "MariaDB is ready!"
              exit 0
            fi

            echo "MariaDB is not ready yet..."
            sleep 2
          done

          echo "MariaDB failed to start"
          docker compose logs mariadb
          exit 1

      # ==========================================
      # 10. Test MariaDB
      # ==========================================
      - name: Test MariaDB
        run: |
          docker compose exec -T mariadb \
            mariadb \
            -u root \
            -ptestrootpassword \
            -e "SHOW DATABASES;"

          echo "MariaDB test passed"

      # ==========================================
      # 11. Test WordPress
      # ==========================================
      - name: Test WordPress
        run: |
          echo "Checking WordPress..."

          docker compose exec -T wordpress \
            test -f /var/www/html/wp-config.php

          docker compose exec -T wordpress \
            test -d /var/www/html/wp-admin

          docker compose exec -T wordpress \
            test -d /var/www/html/wp-content

          echo "WordPress files are OK"

      # ==========================================
      # 12. Test WordPress -> MariaDB
      # ==========================================
      - name: Test WordPress database connection
        run: |
          docker compose exec -T wordpress \
            getent hosts mariadb

          echo "WordPress can resolve MariaDB"

      # ==========================================
      # 13. Test NGINX configuration
      # ==========================================
      - name: Test NGINX
        run: |
          docker compose exec -T nginx nginx -t

          echo "NGINX configuration is valid"

      # ==========================================
      # 14. Wait for HTTPS
      # ==========================================
      - name: Wait for HTTPS
        run: |
          echo "Waiting for HTTPS..."

          for i in {1..30}; do
            if curl \
              --fail \
              --insecure \
              --silent \
              --show-error \
              https://localhost/ > /dev/null; then

              echo "HTTPS is working!"
              exit 0
            fi

            echo "NGINX is not ready yet..."
            sleep 2
          done

          echo "HTTPS failed"
          exit 1

      # ==========================================
      # 15. Test HTTPS response
      # ==========================================
      - name: Test HTTPS response
        run: |
          curl \
            --fail \
            --insecure \
            --silent \
            --show-error \
            https://localhost/

          echo
          echo "HTTPS test passed"

      # ==========================================
      # 16. Check containers
      # ==========================================
      - name: Check containers
        run: |
          docker compose ps

          if docker compose ps | grep -Ei "Exit|Dead"; then
            echo "A container has stopped!"
            exit 1
          fi

          echo "All containers are running"

      # ==========================================
      # 17. Show logs if something fails
      # ==========================================
      - name: Show logs on failure
        if: failure()
        run: |
          echo "======================================"
          echo "DOCKER COMPOSE PS"
          echo "======================================"

          docker compose ps

          echo
          echo "======================================"
          echo "DOCKER COMPOSE LOGS"
          echo "======================================"

          docker compose logs --no-color

      # ==========================================
      # 18. Cleanup
      # ==========================================
      - name: Cleanup
        if: always()
        run: |
          docker compose down -v --remove-orphans || true
          docker system prune -af || true