services:
  mariadb:
    build: requirements/mariadb
    image: mariadb:img 
    container_name: mariadb
    restart: always
    env_file:
      - .env
    networks:
      - inception
    volumes:
      - mariadb_data:/var/lib/mysql
  
  wordpress:
    build: requirements/wordpress
    image: wordpress:img
    container_name: wordpress
    restart: always
    env_file:
      - .env
    depends_on:
      - mariadb
    networks:
      - inception
    volumes:
      - wordpress_data:/var/www/html

  nginx:
    build: requirements/nginx
    image: nginx:img
    container_name: nginx
    restart: always
    ports:
      - 443:443
    depends_on:
      - wordpress
    networks:
      - inception
    volumes:
      - wordpress_data:/var/www/html

volumes:
  mariadb_data:
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH}/mariadb
  wordpress_data:
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH}/wordpress


networks:
  inception:
    driver: bridge